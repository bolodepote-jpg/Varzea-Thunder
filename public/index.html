<!doctype html>
<html>
<head>
<meta charset=utf8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<title>Varzea Thunder Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
:root{--bg:#0c100b;--panel:rgba(18,24,16,.82);--fg:#e8ebdb;--dim:#9aa58a;--accent:#d9a441;--danger:#d2543a;--ok:#86b86b;--line:#3b4733;--disp:'Black Ops One','Impact',sans-serif;--body:'Chakra Petch',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
body.play #c{cursor:none}
.hud{position:absolute;inset:0;pointer-events:none;display:none}
body.play .hud{display:block}
.tl{position:absolute;left:14px;top:10px;width:min(230px,40cqw)}
.bar{height:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:100%;transition:width .15s}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:3px;gap:6px}
.tr{position:absolute;right:14px;top:10px;text-align:right}
.score{font-family:var(--disp);font-size:24px;color:var(--accent);text-shadow:0 1px 4px #000}
.cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--accent);border-radius:50%;opacity:.9}
.cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--accent);border-radius:50%}
.cross.ok{border-color:var(--ok)}.cross.ok::after{background:var(--ok)}
.cross.rel{border-style:dashed;border-color:var(--danger)}
.dist{position:absolute;left:50%;top:calc(50% + 28px);transform:translateX(-50%);font-size:12px;color:var(--fg);text-shadow:0 1px 3px #000}
.scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent 33cqh,#000 34cqh)}
.scope.on{display:block}
.scope::before,.scope::after{content:"";position:absolute;background:#0009}
.scope::before{left:50%;top:calc(50% - 33cqh);width:1px;height:66cqh}
.scope::after{top:50%;left:calc(50% - 33cqh);height:1px;width:66cqh}
.relbox{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(200px,34cqw)}
.banner{position:absolute;left:0;right:0;top:24%;text-align:center;font-family:var(--disp);font-size:clamp(22px,6cqw,52px);color:var(--accent);text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}
.banner.on{opacity:1}
.touch-ui{display:none}
body.touch.play .touch-ui{display:block}
#stick{pointer-events:auto;position:fixed;left:26px;bottom:22px;width:128px;height:128px;border-radius:50%;border:2px solid #fff4;background:#0003}
#knob{position:absolute;left:38px;top:38px;width:52px;height:52px;border-radius:50%;background:#fff5;border:2px solid #fff8}
.tbtn{pointer-events:auto;position:fixed;border-radius:50%;border:2px solid #fff6;background:#0007;color:var(--fg);font:700 13px var(--body);display:flex;align-items:center;justify-content:center}
#btnFire{right:26px;bottom:22px;width:92px;height:92px;background:rgba(210,84,58,.55);font-size:15px}
#btnZoom{right:132px;bottom:30px;width:60px;height:60px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
body.play .ov{display:none}
.wrap{width:min(500px,100%);display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:6px}
h1{font-family:var(--disp);font-weight:400;font-size:36px;margin:0;color:var(--accent);text-align:center}
.sub{color:var(--dim);font-size:13px;text-align:center;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);background:var(--bg);padding:8px;color:var(--fg);text-align:left;cursor:pointer}
.card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card b{display:block;font-size:14px}
.card span{font-size:10px;color:var(--dim);text-transform:uppercase}
.row{display:flex;gap:10px;flex-direction:column}
.btn{background:var(--accent);color:#17120a;border:0;padding:12px;font:700 15px var(--body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:3px;text-align:center}
.input-group{display:flex;gap:8px}
input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:10px;font-family:var(--body);font-size:15px;border-radius:3px}
#roomInfo{background:rgba(0,0,0,.4);padding:10px;border:1px solid var(--line);border-radius:3px;font-size:14px;text-align:center}
</style>

<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div class="scope"></div>
  <div class="cross"></div>
  <div class="dist"></div>
  <div class="tl">
    <div class="lbl"><span>Blindagem</span><span class="hpt">100</span></div>
    <div class="bar"><i class="hp"></i></div>
  </div>
  <div class="tr"><div class="score">0</div></div>
  <div class="relbox">
    <div class="lbl"><span>Recarga</span><span class="relt">PRONTO</span></div>
    <div class="bar"><i class="rb" style="background:var(--accent)"></i></div>
  </div>
  <div class="banner" id="banner"></div>
</div>

<div class="touch-ui">
  <div id="stick"><div id="knob"></div></div>
  <div class="tbtn" id="btnZoom">MIRA</div>
  <div class="tbtn" id="btnFire">FOGO</div>
</div>

<div class="ov" id="menu">
  <div class="wrap">
    <h1>Varzea Thunder</h1>
    <p class="sub">Online Multiplayer (PC & Celular)</p>
    
    <div>
      <label class="lbl">Escolha seu Tanque</label>
      <div class="cards" id="cards"></div>
    </div>

    <div class="row" id="initialBtns">
      <button class="btn" id="bCreate">Criar Nova Sala</button>
      <div class="input-group">
        <input type="text" id="rInput" placeholder="CÓDIGO DA SALA" maxlength="5">
        <button class="btn alt" id="bJoin" style="background:var(--line);color:var(--fg)">Entrar</button>
      </div>
    </div>

    <div id="roomLobby" style="display:none">
      <div id="roomInfo">Sala: <b id="rCodeDisplay">----</b></div>
      <p class="sub" style="margin-top:8px">Jogadores conectados:</p>
      <div id="playersList" style="margin-bottom:10px;font-size:13px;color:var(--dim)"></div>
      <button class="btn" id="bStart">Iniciar Partida</button>
    </div>
    <p id="note" style="color:var(--danger);font-size:12px;margin:0;text-align:center"></p>
  </div>
</div>

<!-- Conectando ao seu servidor no Render -->
<script src="https://varzea-thunder.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const socket = io('https://varzea-thunder.onrender.com');
const T=THREE,$=id=>document.getElementById(id);
const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
document.body.classList.add(isTouch?'touch':'pc');

const types=[
 {n:'M1A2 Abrams',col:0x8a7b52,dk:0x3d382a,hp:120,spd:13,rot:1.1,rel:3.6},
 {n:'T-90M',col:0x55663d,dk:0x2a3320,hp:100,spd:15,rot:1.3,rel:3.0},
 {n:'Leopard 2A7',col:0x65684a,dk:0x2d2f22,hp:110,spd:14,rot:1.2,rel:3.3}
];
let selectedTank = 0;
const cards=$('cards');
types.forEach((t,i)=>{
 const b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed',i===0);
 b.innerHTML='<span>Tanque '+(i+1)+'</span><b>'+t.n+'</b>';
 b.onclick=()=>{selectedTank=i;[...cards.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i))};
 cards.appendChild(b);
});

let currentRoom = null, myPlayer = null, remotePlayers = {};
const keys={}, stick={x:0, y:0};

// UI Room Handlers
$('bCreate').onclick=()=>{
 socket.emit('create_room', selectedTank, (res)=>{
  if(res.success){
   currentRoom = res.roomId;
   $('initialBtns').style.display='none';
   $('roomLobby').style.display='block';
   $('rCodeDisplay').textContent=currentRoom;
  }
 });
};

$('bJoin').onclick=()=>{
 const code = $('rInput').value.trim().toUpperCase();
 if(!code) return;
 socket.emit('join_room', {roomId: code, tankIndex: selectedTank}, (res)=>{
  if(res.success){
   currentRoom = code;
   $('initialBtns').style.display='none';
   $('roomLobby').style.display='block';
   $('rCodeDisplay').textContent=currentRoom;
  } else {
   $('note').textContent = res.message || 'Sala não encontrada.';
  }
 });
};

socket.on('update_players', (players)=>{
 $('playersList.innerHTML') = players.map(p=> '• Jogador ('+types[p.tankIndex].n+')').join('<br>');
});

$('bStart').onclick=()=>{
 socket.emit('start_game');
};

socket.on('start_game', ()=>{
 initGame();
});

function makeTankMesh(ti){
 const g=new T.Group();
 const mat=new T.MeshLambertMaterial({color:types[ti].col, flatShading:true});
 const dm=new T.MeshLambertMaterial({color:types[ti].dk, flatShading:true});
 const body=new T.Mesh(new T.BoxGeometry(2.4,1.1,5),mat); body.position.y=0.55; body.castShadow=true; g.add(body);
 const turret=new T.Group(); turret.position.y=1.2;
 const tMesh=new T.Mesh(new T.BoxGeometry(1.8,0.7,2.2),mat); tMesh.position.z=0.2; turret.add(tMesh);
 const gun=new T.Mesh(new T.CylinderGeometry(0.12,0.15,4,8),dm); gun.rotation.x=Math.PI/2; gun.position.set(0,0.1,-2); turret.add(gun);
 g.add(turret);
 return {g, turret};
}

function initGame(){
 $('menu').style.display='none';
 document.body.classList.add('play');

 const R=new T.WebGLRenderer({canvas:$('c'), antialias:!isTouch});
 R.setSize(innerWidth,innerHeight);
 const scene=new T.Scene(); scene.background=new T.Color(0xa9bfcf); scene.fog=new T.Fog(0xa9bfcf,100,400);
 const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,0.5,500);

 scene.add(new T.HemisphereLight(0xdfe9f2,0x4a5236,1));
 const sun=new T.DirectionalLight(0xfff1d6,1); sun.position.set(50,100,50); scene.add(sun);

 // Chão
 const plane=new T.Mesh(new T.PlaneGeometry(500,500,64,64), new T.MeshLambertMaterial({color:0x5b7a38, flatShading:true}));
 plane.rotation.x=-Math.PI/2; scene.add(plane);

 // Criar meu tanque
 const myData = makeTankMesh(selectedTank);
 scene.add(myData.g);
 myPlayer = { x:0, z:0, yaw:0, tYaw:0, gPitch:0, hp:100, mesh:myData.g, turret:myData.turret };

 // Ouvir atualizações de outros jogadores via Socket.io
 socket.on('player_state', (data)=>{
  if(!remotePlayers[data.id]){
   const rTank = makeTankMesh(data.tankIndex);
   scene.add(rTank.g);
   remotePlayers[data.id] = { mesh: rTank.g, turret: rTank.turret, ...data };
  } else {
   Object.assign(remotePlayers[data.id], data);
  }
 });

 socket.on('player_disconnected', (id)=>{
  if(remotePlayers[id]){
   scene.remove(remotePlayers[id].mesh);
   delete remotePlayers[id];
  }
 });

 let lastTime = performance.now();
 function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime)/1000);
  lastTime = now;

  // Movimento local simples (WASD ou Joystick)
  let speed = 0, turnDir = 0;
  if(keys.w || keys.W) speed = types[selectedTank].spd;
  if(keys.s || keys.S) speed = -types[selectedTank].spd * 0.5;
  if(keys.a || keys.A) turnDir = 1.2;
  if(keys.d || keys.D) turnDir = -1.2;

  myPlayer.yaw += turnDir * dt;
  myPlayer.x += -Math.sin(myPlayer.yaw) * speed * dt;
  myPlayer.z += -Math.cos(myPlayer.yaw) * speed * dt;

  myPlayer.mesh.position.set(myPlayer.x, 0, myPlayer.z);
  myPlayer.mesh.rotation.y = myPlayer.yaw;

  // Enviar minha posição para o servidor
  socket.emit('player_state', {
   x: myPlayer.x, z: myPlayer.z, yaw: myPlayer.yaw, tankIndex: selectedTank
  });

  // Atualizar tanques remotos na tela
  for(let id in remotePlayers){
   const p = remotePlayers[id];
   p.mesh.position.set(p.x, 0, p.z);
   p.mesh.rotation.y = p.yaw;
  }

  // Câmera seguindo o jogador
  cam.position.set(myPlayer.x + Math.sin(myPlayer.yaw)*10, myPlayer.y + 4, myPlayer.z + Math.cos(myPlayer.yaw)*10);
  cam.lookAt(myPlayer.x, myPlayer.y + 1, myPlayer.z);

  R.render(scene, cam);
 }
 requestAnimationFrame(loop);
}

// Eventos de Teclado
window.addEventListener('keydown', e=> keys[e.key] = true);
window.addEventListener('keyup', e=> keys[e.key] = false);

})();
</script>
</body>
</html>
